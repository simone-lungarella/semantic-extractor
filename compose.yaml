services:
  redis:
    image: docker.io/redis/redis-stack-server:latest
    container_name: semantic-extractor-redis
    ports:
      - "6379:6379"
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
