services:
  redis:
    image: docker.io/redis/redis-stack-server:latest
    container_name: semantic-extractor-redis
    ports:
      - "6379:6379"
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: semantic-extractor-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    profiles: ["ollama"]

volumes:
  redis-data:
  ollama-data:
