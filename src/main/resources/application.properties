spring.application.name=semantic-extractor

# Override these defaults when Redis runs on another host or port.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Expose only the health endpoint. Its Redis health contributor executes a
# real command, proving that the configured Redis instance is reachable.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Embeddings are optional until a provider is selected. Secrets and
# account-specific values are supplied through environment variables.
semantic-extractor.embedding.provider=${EMBEDDING_PROVIDER:none}
semantic-extractor.embedding.watsonx.api-key=${WATSONX_API_KEY:}
semantic-extractor.embedding.watsonx.project-id=${WATSONX_PROJECT_ID:}
semantic-extractor.embedding.watsonx.url=${WATSONX_URL:}
semantic-extractor.embedding.watsonx.model-id=ibm/granite-embedding-278m-multilingual
